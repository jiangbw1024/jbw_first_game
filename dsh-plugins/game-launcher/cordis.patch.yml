# 游戏启动器：Host 端注册 /api/game-launcher/* 接口，Client 端在输入框下方加一枚按钮。
- insert:
    - id: game-launcher
      name: '@local/game-launcher'
      config:
        # 游戏项目目录（里面要有 run.sh）
        gameDir: /Users/aaaa/PycharmProjects/jbw_first_game
        # 按钮点下去的默认模式：solo | menu | host | join | both | editor
        mode: solo
